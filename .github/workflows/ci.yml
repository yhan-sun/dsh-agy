name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AGY_CLIENT_ID: test-client-id
      AGY_CLIENT_SECRET: test-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # build before test: the MCP bridge E2E test spawns dist/bridge.mjs
      - run: npm run build

      - run: npm test
